services:
  ocr_api:
    image: ocr:v0
    container_name: ocr
    ports:
      - "8001:8001"
    volumes:
      - .:/app
    command: "bash env.sh"
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ocr_client:
    image: python:3.12-slim
    container_name: ocr_client
    working_dir: /app
    volumes:
      - .:/app
    command: "tail -f /dev/null"
